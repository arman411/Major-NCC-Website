<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Page Not Found – NCC Govt. Polytechnic Hamirpur (HP)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <style>
    .error-container {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }
    .error-card {
      max-width: 540px;
      padding: 48px 36px;
      background: white;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--mid-gray);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 900;
      color: var(--navy);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }
    .error-code span { color: var(--red); }
    .error-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 0.92rem;
      color: var(--text-mid);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-card">
      <div class="error-code">4<span>0</span>4</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">The page or resource you are looking for might have been moved, removed, or is temporarily unavailable.</p>
      <div class="error-actions">
        <a href="{{ url_for('home') }}" class="btn btn-danger">
          <i class="fas fa-home"></i> Back to Homepage
        </a>
        <a href="{{ url_for('contact') }}" class="btn btn-outline">
          <i class="fas fa-envelope"></i> Contact Support
        </a>
      </div>
    </div>
  </div>
</body>
</html>
